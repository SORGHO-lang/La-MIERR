# Configuration de l'interface d'administration Decap CMS.
# Voir README.md, section « Administration du contenu ».
backend:
  name: github
  repo: SORGHO-lang/La-MIERR      # À adapter au dépôt définitif
  branch: main                    # Branche publiée
  # base_url: https://votre-service-oauth.example   # Requis hors Netlify (voir README)

locale: fr
publish_mode: editorial_workflow
media_folder: guems-mining/static/assets/uploads
public_folder: /assets/uploads

collections:
  - name: news
    label: Actualités
    label_singular: Actualité
    folder: guems-mining/content/news
    extension: json
    format: json
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title_fr
    summary: "{{date}} — {{title_fr}}"
    sortable_fields: [date, title_fr]
    fields:
      - { name: title_fr, label: "Titre (français)", widget: string }
      - { name: slug, label: "Adresse (URL) — lettres minuscules et tirets", widget: string, hint: "Ex. : signature-partenariat-2026" }
      - { name: date, label: "Date de publication", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - name: category
        label: Catégorie
        widget: select
        options:
          - { label: "Entreprise", value: entreprise }
          - { label: "Annonces officielles", value: annonces }
          - { label: "Activités et événements", value: evenements }
          - { label: "Secteur minier", value: secteur }
          - { label: "Communiqués", value: communiques }
      - { name: image, label: "Image principale (photographie authentique ou sous licence)", widget: image, required: false }
      - { name: image_alt_fr, label: "Description de l'image (français)", widget: string, required: false }
      - { name: excerpt_fr, label: "Résumé (français)", widget: text, required: false }
      - { name: body_fr, label: "Contenu (français)", widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], editor_components: [] }
      - { name: title_en, label: "Title (English) — facultatif", widget: string, required: false }
      - { name: image_alt_en, label: "Image description (English)", widget: string, required: false }
      - { name: excerpt_en, label: "Summary (English)", widget: text, required: false }
      - { name: body_en, label: "Content (English)", widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], editor_components: [] }
      - { name: draft, label: "Brouillon (non publié)", widget: boolean, default: true }

  - name: projects
    label: Réalisations
    label_singular: Réalisation
    folder: guems-mining/content/projects
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    identifier_field: name_fr
    summary: "{{name_fr}} — {{location}}"
    fields:
      - { name: name_fr, label: "Nom du projet (français)", widget: string }
      - { name: slug, label: "Adresse (URL) — lettres minuscules et tirets", widget: string }
      - { name: location, label: "Localisation", widget: string, required: false }
      - { name: period, label: "Période de réalisation", widget: string, required: false, hint: "Ex. : 2025 – 2026" }
      - { name: order, label: "Ordre d'affichage", widget: number, value_type: int, required: false }
      - { name: description_fr, label: "Description (français)", widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], editor_components: [] }
      - { name: results_fr, label: "Résultats communiqués et autorisés (français)", widget: markdown, required: false, buttons: [bold, italic, bulleted-list], editor_components: [] }
      - { name: name_en, label: "Project name (English)", widget: string, required: false }
      - { name: description_en, label: "Description (English)", widget: markdown, required: false, buttons: [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list], editor_components: [] }
      - { name: results_en, label: "Results (English)", widget: markdown, required: false, buttons: [bold, italic, bulleted-list], editor_components: [] }
      - name: images
        label: "Photographies authentiques"
        widget: list
        required: false
        fields:
          - { name: src, label: Image, widget: image }
          - { name: alt_fr, label: "Description (français)", widget: string }
          - { name: alt_en, label: "Description (English)", widget: string, required: false }
      - { name: draft, label: "Brouillon (non publié)", widget: boolean, default: true }
